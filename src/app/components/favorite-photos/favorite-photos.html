<section id="favoritas" class="section favorites"><div class="heading"><p class="eyebrow">Las que siempre elijo</p><h2>Mis favoritas de nosotros <span>♥</span></h2></div><div class="strip">@for(photo of photos;track photo.id;let i=$index){<button (click)="open(i)"><img [src]="photo.src" [alt]="photo.alt" loading="lazy"><span><small>Recuerdo favorito</small>{{photo.title}}</span></button>}</div></section>@if(selected()!==null){<app-photo-lightbox [photos]="photos" [index]="selected()!" (indexChange)="selected.set($event)" (closed)="close()"/>}
